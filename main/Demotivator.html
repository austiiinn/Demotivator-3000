<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino LCD Demotivator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    background-image: url("bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: Arial, sans-serif;
}

.lcd {
    position: relative;
    width: min(849px, 90vw);
    aspect-ratio: 849 / 377;
    background-image: url("LCD.jpg");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

.screen {
    position: absolute;
    left: 8%;
    top: 26.3%;
    width: 84%;
    height: 48.5%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    color: #344c08;
    text-align: center;

    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: clamp(18px, 3.1vw, 38px);
    line-height: 1.55;
    letter-spacing: 0.08em;
}

.line {
    width: 100%;
    white-space: nowrap;
}

#connect {
    padding: 11px 22px;
    border: 0;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#connect:hover {
    background: #444;
}

#connect.hidden {
    display: none;
}

#status {
    min-height: 24px;
    color: #aaa;
    font-size: 16px;
}

#status.connected {
    color: #7CFC00;
}
</style>
</head>

<body>

<button id="connect" onclick="connectArduino()">Connect Arduino</button>

<div class="lcd">
    <div class="screen">

        <!--
        THIS IS THE ORIGINAL START SCREEN.
        It is hard-coded, so it ALWAYS appears after refresh.
        -->
        <div class="line" id="line1">PRESS BUTTON</div>
        <div class="line" id="line2">TO BEGIN</div>

    </div>
</div>

<div id="status">Arduino: not connected</div>

<script>

/*

    ["YOU TRIED.", "THAT WAS THE PROBLEM."],
["ERROR 404:", "SKILL NOT FOUND."],
["GOOD JOB.", "NOBODY NOTICED."],
["KEEP GOING.", "IT'S FUNNY."],

["KEEP IT UP.", "WE NEED A LAUGH."],

    ["NICE BUTTON.", "VERY IMPRESSIVE."],
    ["YOU MADE IT.", "BARELY."],
    ["CONGRATULATIONS.", "FOR WHAT?"],
    ["WOW.", "THAT SURE HAPPENED."],
    ["BELIEVE IN YOURSELF.", "JUST KIDDING."]
];


/*
=========================================================
RANDOM QUOTE
=========================================================

IMPORTANT:
This function is NOT called when the page loads.

The page therefore ALWAYS starts with:

PRESS BUTTON
TO BEGIN

A random quote is selected only when Arduino sends
NEXT or PRESSED.
=========================================================
*/

let lastQuoteIndex = -1;

function showRandomQuote() {

    let newIndex;

    do {
        newIndex = Math.floor(Math.random() * quotes.length);
    } while (
        quotes.length > 1 &&
        newIndex === lastQuoteIndex
    );

    lastQuoteIndex = newIndex;

    document.getElementById("line1").textContent =
        quotes[newIndex][0];

    document.getElementById("line2").textContent =
        quotes[newIndex][1];
}


/*
=========================================================
ARDUINO CONNECTION
=========================================================
*/

async function connectArduino() {

    if (!("serial" in navigator)) {
        alert(
            "Web Serial is not supported.\n\n" +
            "Please use Google Chrome or Microsoft Edge."
        );
        return;
    }

    try {

        const port = await navigator.serial.requestPort();

        await port.open({
            baudRate: 9600
        });


        /*
        Hide Connect Arduino after successful connection.
        */
        document.getElementById("connect")
            .classList.add("hidden");


        /*
        Keep the connection message at the bottom.
        */
        const status = document.getElementById("status");

        status.textContent = "Arduino Connected ✓";
        status.classList.add("connected");


        /*
        Read Arduino Serial data.
        */
        const decoder = new TextDecoderStream();

        port.readable.pipeTo(decoder.writable);

        const reader = decoder.readable.getReader();

        let buffer = "";


        while (true) {

            const { value, done } = await reader.read();

            if (done) {
                break;
            }

            buffer += value;

            const lines = buffer.split(/\r?\n/);

            buffer = lines.pop();


            for (const line of lines) {

                const message = line.trim();

                console.log("Arduino:", message);


                /*
                Your drum-roll Arduino sends NEXT.
                The older Arduino sends PRESSED.

                Either one changes the LCD.
                */
                if (
                    message === "NEXT" ||
                    message === "PRESSED"
                ) {
                    showRandomQuote();
                }
            }
        }

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Connection failed — try again.";

        alert(
            "Connection failed:\n\n" +
            error.name + "\n" +
            error.message
        );
    }
}

</script>

</body>
</html>
